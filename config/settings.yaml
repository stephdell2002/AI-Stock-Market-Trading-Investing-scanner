# Watchman settings.
# Everything here is tunable. Hard risk limits live in risk.yaml, not here.
# API keys are NEVER put in this file — they come from env vars (see .env.example).

data:
  # Active market-data provider. yfinance = free, end-of-day. When a real-time
  # provider is configured later, Module B signals stop being labeled DELAYED.
  provider: yfinance
  # SQLite file for the price cache, signal ledger, and paper portfolios.
  db_path: data/watchman.db

universe:
  # Module A screening universe. Bundled snapshots: sp500, nasdaq100.
  indices: [sp500, nasdaq100]
  # Manual additions/removals (yfinance-style symbols, e.g. BRK-B).
  extra_symbols: []
  exclude_symbols: []

accounts:
  # Simulated paper accounts. Two independent books.
  day_trading_equity: 10000.0   # Module B auto-taken paper trades
  long_term_equity: 10000.0     # Module A simulated portfolio, monthly rebalance

costs:
  # Applied to EVERY backtest fill and EVERY paper fill. Costs are real.
  slippage_bps: 5.0             # adverse move vs. reference price, per side
  spread_bps: 2.0               # half-spread paid on entry and on exit
  commission_per_trade: 0.0     # flat $ per fill (IBKR Lite-style default)

screener:
  # Module A composite score weights. Must sum to 1.0 (validated at load).
  weights:
    quality: 0.30
    growth: 0.25
    valuation: 0.25
    momentum: 0.20
  watchlist_size: 15            # ranked names to output (10–20 sensible)
  data_max_age_days: 3          # refetch fundamentals/statements older than this

signals:
  # Module B pre-market scanner + intraday setups. Hard risk limits (1%/trade,
  # 3 positions, circuit breaker, R:R >= 2) live in risk.yaml, not here.
  focus_size: 10                # max tickers on the daily focus list (spec cap)
  min_price: 5.0                # skip sub-$5 names
  min_avg_dollar_volume: 20000000  # 20-day avg dollar-volume liquidity gate
  min_gap_pct: 2.0              # pre-market gap threshold (absolute %)
  min_rel_vol: 1.5              # pre-market volume vs typical fraction of a day
  intraday_interval: 5m         # bar size for setups (1m/5m/15m/30m/60m)
  orb_minutes: 15               # opening-range length for the ORB setup

report:
  output_dir: data/reports      # HTML dashboard + dated morning/evening briefs
