# Watchman hard risk limits. These are enforced in code, not suggestions.
# Loosening any of these deserves a written justification in the commit message.

# Max % of account equity risked on a single trade (risk = entry minus stop,
# times shares). Position size is derived from this: risk dollars / (entry - stop).
max_risk_per_trade_pct: 1.0

# Max simultaneously open day-trade positions (Module B paper book).
max_concurrent_day_positions: 3

# Daily circuit breaker: once the day-trading book is down this % on the day,
# stop emitting day-trade signals until the next session.
daily_circuit_breaker_pct: -2.0

# Signals with reward:risk below this are rejected before they are ever shown.
min_risk_reward: 2.0
