[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "watchman"
version = "0.1.0"
description = "Personal AI stock analysis and signal system. Paper trading only; credibility through statistical honesty."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "yfinance>=0.2.40",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
watchman = "watchman.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/watchman"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM108"]
